<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>수학 풀이 코치 · 답 대신 방향</title>
<meta name="description" content="수능 수학 문제와 막힌 지점을 넣으면, 답이 아니라 어떻게 풀지 '방향'을 알려주고 핵심을 그래프로 보여줍니다." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendard-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>
<!-- KaTeX 안전망: 기본 CDN이 실패하면 unpkg에서 재시도 (수식이 $ 글자로 보이는 문제 방지) -->
<script>window.addEventListener("load",function(){if(!window.renderMathInElement){["https://unpkg.com/katex@0.16.11/dist/katex.min.js","https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js"].forEach(function(u){var s=document.createElement("script");s.src=u;document.head.appendChild(s);});}});</script>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand"><span class="brand-mark">∫</span><span>수학 풀이 코치</span></div>
    <span class="brand-tag">답 대신 <b>방향</b></span>
  </div>
</header>

<main class="wrap">
  <section id="onboard" class="card onboard-card">
    <h3 class="onboard-title">실험 참여 정보</h3>
    <div class="field">
      <label for="pid">참가자 코드</label>
      <input id="pid" type="text" placeholder="예) P07" class="onboard-input" />
    </div>
    <div class="field">
      <label class="onboard-label">배운 데까지 골라줘</label>
      <div class="onboard-checks">
        <label><input type="checkbox" value="basic"> 기본 적분공식</label>
        <label><input type="checkbox" value="substitution"> 치환적분</label>
        <label><input type="checkbox" value="byparts"> 부분적분</label>
        <label><input type="checkbox" value="partialfrac"> 부분분수 분해</label>
      </div>
    </div>
    <button id="onboardSave" class="btn btn-primary">시작하기</button>
  </section>

  <section class="card composer">
    <div class="field problem-field">
      <label>문제 사진</label>
      <p class="help">문제집·시험지를 찍어 올리고, 아래에는 막힌 지점만 적어요.</p>
      <input type="file" id="probPhotoInput" accept="image/*" hidden />
      <div class="photo-card">
        <button type="button" id="probPhotoBtn" class="photo-upload">
          <span class="photo-icon">📷</span>
          <span class="photo-main">문제 사진 올리기</span>
          <span class="photo-sub">카메라 촬영 또는 파일 선택</span>
        </button>
        <span class="photo-hint" id="probPhotoHint"></span>
        <div id="probThumbWrap" class="thumb-wrap hidden">
          <img id="probThumb" class="thumb" alt="올린 문제 사진" />
          <button type="button" id="probThumbX" class="thumb-x" title="사진 제거">✕</button>
        </div>
      </div>
      <details class="manual-problem">
        <summary>사진 대신 텍스트로 입력</summary>
        <label for="problem" class="manual-label">문제 텍스트</label>
        <textarea id="problem" rows="3" placeholder="사진이 없을 때만 문제를 직접 입력해요."></textarea>
        <div class="mprev hidden" id="probPrev"></div>
      </details>
    </div>
    <div class="field">
      <label>어디서 막혔어? <span class="opt">하나 골라줘 · 안 골라도 돼</span></label>
      <div class="stage-picker" id="stagePicker">
        <button type="button" class="stage-btn" data-stage="nostart">시작 못함</button>
        <button type="button" class="stage-btn" data-stage="comprehension">문제 이해 안 됨</button>
        <button type="button" class="stage-btn" data-stage="transform">방법 모르겠어</button>
        <button type="button" class="stage-btn" data-stage="process">계산 중에 막혔어</button>
        <button type="button" class="stage-btn" data-stage="encoding">검산·표기 헷갈려</button>
        <button type="button" class="stage-btn" data-stage="prerequisite">기초 개념 부족</button>
      </div>
      <label for="stuck" class="stage-detail-label">더 설명해줘 <span class="opt">선택</span></label>
      <p class="help">🗣️ 말로 설명해도 돼요. AI가 수식으로 바꿔 확인해줘요. 수식 타이핑 <code>x^2</code>·<code>sqrt(x)</code>·<code>f'(x)</code>도 OK</p>
      <textarea id="stuck" rows="2" placeholder="예) 어디서 시작해야 할지 모르겠어."></textarea>
      <div class="symbolbar" id="symbolbar"></div>
      <div class="mprev hidden" id="stuckPrev"></div>
    </div>
    <div class="actions">
      <button id="go" class="btn btn-primary">코치에게 물어보기</button>
      <button id="demo" class="btn btn-ghost">예시 보기</button>
    </div>
    <div id="msg" class="status" role="status" aria-live="polite"></div>
    <div id="quota" class="quota hidden" title="공개 서비스라 한 시간에 IP당 40번까지 물어볼 수 있어요(무료 보호장치). 한 시간 지나면 다시 채워져요.">
      <span class="quota-label">🔋 이번 시간 남은 질문</span>
      <div class="quota-bar"><i id="quotaFill"></i></div>
      <span id="quotaNum" class="quota-num"></span>
    </div>
  </section>

  <section id="mistakeNote" class="card mistake-note hidden" aria-live="polite">
    <div class="mn-head">
      <span class="mn-title">📊 내 실수 노트 <span class="mn-tag">이 기기에 누적 · 코칭 반영</span></span>
      <div class="mn-head-btns">
        <button id="mnExport" class="btn btn-ghost btn-sm">실험 데이터 내보내기</button>
        <button id="mnClear" class="btn btn-ghost btn-sm">기록 지우기</button>
      </div>
    </div>
    <p id="mnSummary" class="mn-summary"></p>
    <div id="mnViz"></div>
    <p class="mn-foot">코치가 짚어준 실수를 유형별로 모아 다음 코칭에 살짝 반영해요. (서버에 올라가지 않아요)</p>
  </section>

  <section id="result" class="result hidden" aria-live="polite">
    <div id="personalBadge" class="personal-badge hidden"></div>
    <figure id="vizCard" class="card graph">
      <div class="graph-tools"><button type="button" id="vizReset" class="btn btn-ghost btn-sm">↺ 초기화</button></div>
      <div id="viz"></div>
      <figcaption id="vizCap" class="graph-cap"></figcaption>
    </figure>
    <div id="coach" class="coaching"></div>
    <div id="followBox" class="card followbox hidden">
      <label for="followup" class="follow-label">✏️ 위 <b>👉 다음 한 걸음</b>을 해봤다면 한 줄로 적어줘 — 이어서 코칭할게</label>
      <div id="followSuggest" class="follow-suggest hidden"></div>
      <textarea id="followup" rows="2" placeholder="예) 제곱하니 x가 됐어. 이제 ∫₀⁴ x dx 를 계산하면 되는 거지?"></textarea>
      <div class="symbolbar" id="symbolbarFollow"></div>
      <div class="mprev hidden" id="followPrev"></div>
      <div class="follow-row">
        <button id="followGo" class="btn btn-primary">다음 걸음 →</button>
        <span class="follow-hint">⌘/Ctrl + Enter</span>
        <button id="savePdf" class="btn btn-ghost btn-pdf">🖨 PDF로 저장</button>
      </div>
      <div id="followMsg" class="status" role="status" aria-live="polite"></div>
    </div>
  </section>
</main>

<footer class="wrap site-footer"><p>풀이 방향 코칭 · 정답은 직접 완성해요. 그림은 핵심 직관용이에요.</p></footer>
<script src="./evidence.js"></script>
<script src="./verify.js"></script>
<script src="./episode.js"></script>
<script src="./app.js"></script>
</body>
</html>
